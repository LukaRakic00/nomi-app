services:
  postgres:
    image: postgres:16-alpine
    container_name: nomi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nomi}
      POSTGRES_USER: ${POSTGRES_USER:-nomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nomi_postgres_data:/var/lib/postgresql/data
    networks:
      - nomi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nomi} -d ${POSTGRES_DB:-nomi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Samo lokalno na serveru — backend kasnije ide preko nomi-net.
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  nomi_postgres_data:

networks:
  nomi-net:
    name: nomi-net
